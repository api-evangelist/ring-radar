aid: ring-radar
name: Ring Radar
description: Ring Radar is horse show management software for the equestrian industry,
  operating at ringradar.com. The web-based platform helps horse show organizers,
  managers, and exhibitors run competitions end to end - handling show entries, class
  scheduling, ring coordination, results, and exhibitor information. Ring Radar is
  a portfolio company of 500 Global. As of this profile the company runs a consumer
  web application (login and signup) but publishes no public developer API, SDKs,
  OpenAPI, or developer documentation surface that could be discovered.
